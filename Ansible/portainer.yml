---
- name: Instalar Docker y Portainer
  hosts: portainer
  become: true
  tasks:
    - name: Instalar dependencias previas
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip # Necesario para el módulo de docker de ansible
        state: latest
        update_cache: yes

    - name: Crear directorio para las llaves apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Añadir GPG key oficial de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Añadir repositorio de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: yes

    - name: Instalar Docker y plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Asegurar que Docker está corriendo
      service:
        name: docker
        state: started
        enabled: yes

    - name: Instalar librería Python para Docker (SDK) mediante APT
      apt:
        name: python3-docker
        state: present

    # 3. DESPLIEGUE DE PORTAINER
    - name: Crear volumen para datos de Portainer
      docker_volume:
        name: portainer_data

    - name: Desplegar contenedor Portainer
      docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        restart_policy: always
        ports:
          - "8000:8000"
          - "9443:9443"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "portainer_data:/data"